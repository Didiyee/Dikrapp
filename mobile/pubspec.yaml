name: salati_dhikri
description: Muslim prayer times and daily adhkar app - support RTL Arabic.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  google_fonts: ^6.2.0
  audioplayers: ^6.1.0
  flutter_tts: ^4.0.0
  geolocator: ^13.0.0
  flutter_compass: ^0.8.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
